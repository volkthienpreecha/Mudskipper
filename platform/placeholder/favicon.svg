<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mudskipper mark">
  <!-- Original two-tone line drawing of a mudskipper (SPEC D7): head and fins on the Mud, tail in the Water. -->
  <defs>
    <clipPath id="mud"><rect x="0" y="0" width="33" height="64"/></clipPath>
    <clipPath id="water"><rect x="33" y="0" width="31" height="64"/></clipPath>
    <g id="fish" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 37c0-7.5 5.6-12 13-12 9 0 17 3.6 25.5 7.2L57 27.5l-2.6 9 3.1 8.6-11.6-5c-8.3 2.4-17 3.6-25.6 2.9C12.6 42.4 7 41.4 7 37z"/>
      <path d="M27.5 25.6l3.2-8.1c4.4-.4 8.6 1.6 11.4 5.4l1.4 7.6"/>
      <path d="M19.5 42c-.8 4 1.2 6.4 5.5 6.2"/>
      <path d="M7.5 37.2h4.6"/>
      <circle cx="14.6" cy="21.6" r="3"/>
      <circle cx="21.4" cy="20.8" r="3"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0E1A1F"/>
  <use href="#fish" stroke="#C98B4E" clip-path="url(#mud)"/>
  <use href="#fish" stroke="#3FA7D6" clip-path="url(#water)"/>
  <path d="M5 54h26" stroke="#C98B4E" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M35 54c2.5-2.4 5-2.4 7.5 0s5 2.4 7.5 0 5-2.4 7.5 0" fill="none" stroke="#3FA7D6" stroke-width="3.2" stroke-linecap="round"/>
</svg>
