[project]
name = "mudskipper-geo"
version = "0.1.0"
description = "Mudskipper geo lane: study tiles, rice-field polygons, district table and synthetic sample claims."
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "numpy==2.5.4",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pyogrio==0.13.0",
    "geopandas==1.2.0",
    "duckdb==2.0.0",
    "rasterio==1.5.2",
    "pyarrow==23.0.1",
]

[project.optional-dependencies]
ftw = ["ftw-tools==2.0.0b5"]

[dependency-groups]
dev = ["pytest==9.2.0", "jsonschema==4.26.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
