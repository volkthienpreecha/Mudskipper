name: platform

# The Cloudflare platform: typecheck, tests (workerd + Node + `wrangler pages dev`), the fixture site build,
# and, on main, a production deploy of the fixture site to https://mudskipper-nisar.pages.dev followed by the
# smoke test. The deploy runs only when the repo has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets,
# and never replaces a real run that `make publish RUN_ID=…` put live (it checks live.json first).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (wrangler types, generated validators, runtime + scripts)
        run: npm run typecheck -w platform
      - name: Test (workerd routes on both backends, loader, bundle, site under wrangler pages dev)
        run: npm run test -w platform
      - name: Test run_transfer.py (share/fetch through a fake GitHub CLI)
        run: python3 -m unittest discover -s platform/test/python
      - name: Build the fixture site
        run: npm run build:site -w platform -- --fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-fixtures
          path: platform/.site
          retention-days: 7

  deploy:
    name: deploy fixtures to Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. A repo admin adds them in Settings → Secrets and variables → Actions (platform/README.md, \"CI deploy\"). Until then, deploy with \`make publish FIXTURES=1\`."
          fi
      - name: Check what production serves
        id: live
        if: steps.secrets.outputs.ok == 'true'
        run: |
          live=$(curl -fsS https://mudskipper-nisar.pages.dev/data/live.json || echo '{}')
          echo "production live.json: $live"
          if echo "$live" | grep -q '"fixture": *false'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Production serves a real run; CI deploys only the fixture site. Publish real runs with make publish RUN_ID=…"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.live.outputs.deploy == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.live.outputs.deploy == 'true'
      - name: Build the fixture site
        if: steps.live.outputs.deploy == 'true'
        run: npm run build:site -w platform -- --fixtures
      - name: Deploy to Cloudflare Pages (production branch main)
        if: steps.live.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform
          wranglerVersion: "4.162.0"
          packageManager: npm
          command: pages deploy .site --project-name mudskipper-nisar --branch main --commit-hash ${{ github.sha }} --commit-dirty=true
      - name: Smoke test production
        if: steps.live.outputs.deploy == 'true'
        run: |
          for i in 1 2 3; do npm run smoke -w platform -- --expect-run fixture && exit 0; sleep 10; done
          exit 1
