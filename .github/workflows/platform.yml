name: platform

# The Cloudflare platform: typecheck, tests (workerd + Node + `wrangler pages dev`), the fixture site build,
# and, on main, `publish.ts --fixtures`: the app + fixture site deployed to the staging preview and smoke-tested, then
# to production (https://mudskipper-nisar.pages.dev) and smoke-tested again. It runs only with the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets,
# and never replaces a real run that `make publish RUN_ID=…` put live (it checks live.json first).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (wrangler types, generated validators, runtime + scripts)
        run: npm run typecheck -w platform
      - name: Test (workerd routes on both backends, loader, bundle, site under wrangler pages dev)
        run: npm run test -w platform
      - name: Test run_transfer.py (share/fetch through a fake GitHub CLI)
        run: python3 -m unittest discover -s platform/test/python
      - name: Build the fixture site
        run: npm run build:site -w platform -- --fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-fixtures
          path: platform/.site
          retention-days: 7

  deploy:
    name: deploy fixtures to Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. A repo admin adds them in Settings → Secrets and variables → Actions (platform/README.md, \"CI deploy\"). Until then, deploy with \`make publish FIXTURES=1\`."
          fi
      - name: Check what production serves
        id: live
        if: steps.secrets.outputs.ok == 'true'
        # Fails closed (review item 7): an unreachable site or a body that is not live.json JSON stops the job
        # instead of being read as "no real run" and deployed over.
        run: |
          set -euo pipefail
          code=$(curl -sS -o live.json -w '%{http_code}' https://mudskipper-nisar.pages.dev/data/live.json)
          echo "production live.json: HTTP $code $(head -c 300 live.json)"
          if [ "$code" != "200" ]; then echo "::error::cannot read production live.json (HTTP $code)"; exit 1; fi
          fixture=$(jq -er '.fixture | if type == "boolean" then tostring else error("fixture is not a boolean") end' live.json)
          if [ "$fixture" = "false" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Production serves a real run; CI deploys only the fixture site. Publish real runs with make publish RUN_ID=…"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.live.outputs.deploy == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.live.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.live.outputs.deploy == 'true'
      - name: Publish the fixture run (preview, smoke, then production, smoke)
        if: steps.live.outputs.deploy == 'true'
        # scripts/publish.ts builds the app and the site, deploys the staging preview and smoke-tests it, and only
        # then deploys production and smoke-tests that (review item 3): production never serves an unsmoked site.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run publish -w platform -- --fixtures
