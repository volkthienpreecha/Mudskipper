name: app
on:
  pull_request:
    paths: ["app/**", "core/**", "package.json", "package-lock.json", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "core/**", "package.json", "package-lock.json", ".github/workflows/app.yml"]
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: frontend adapter, typecheck, build and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @mudskipper/app
      - run: npm run build -w @mudskipper/app
      # WCAG 2.2 AA: axe-core in every state plus a keyboard-only walkthrough, in headless Chromium.
      # The published-run states call the live API, as the deployed app does.
      - name: Install Playwright Chromium (headless shell)
        run: npx playwright install --with-deps --only-shell chromium
      - name: Accessibility (axe-core and keyboard walkthrough)
        run: npm run test:a11y -w @mudskipper/app
