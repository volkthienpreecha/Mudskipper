name: app
on:
  pull_request:
    paths: ["app/**", "core/**", "package.json", "package-lock.json", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "core/**", "package.json", "package-lock.json", ".github/workflows/app.yml"]
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    name: frontend adapter, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @mudskipper/app
      - run: npm run build -w @mudskipper/app
