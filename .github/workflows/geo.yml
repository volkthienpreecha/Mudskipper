name: geo

# Geo lane (geo/): offline unit tests on small synthetic rasters and polygons, plus a lockfile drift check.
# No network beyond installing the locked dependencies; the real-data scripts run on laptops (make grid/fields).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: geo tests (python 3.12, uv)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: geo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          working-directory: geo
          enable-cache: true
          cache-dependency-glob: geo/uv.lock
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install the locked environment (no ftw extra)
        run: uv sync --frozen
      - name: Unit tests
        run: uv run --frozen pytest -v
